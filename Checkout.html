<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvo - Checkout</title>
  <link rel="stylesheet" href="CheckoutButton.css">
</head>
<body>
  <main class="checkout">
    # Tu pedido

  <button class="btn-order" type="button">Pedir ahora</button>
